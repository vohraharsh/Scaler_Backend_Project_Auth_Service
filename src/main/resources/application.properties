server.port=8082
spring.application.name=auth-service
# Dev-only secret. Must be at least 32 bytes for HS256 — treat as a real secret once this
# moves anywhere beyond a local capstone (don't commit a production value to source control).
jwt.secret=ThisIsADevOnlySecretKeyForHS256MustBe32BytesOrLonger!
jwt.expiration-ms=3600000
spring.data.redis.host=localhost
spring.data.redis.port=6379